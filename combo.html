<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>무기 조합 모드</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui;max-width:1200px;margin:30px auto;padding:0 16px}
  h1{margin-bottom:6px}
  h2{margin:16px 0 6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{border:2px dashed #aaa;border-radius:12px;padding:18px;text-align:center;font-weight:700}
  .list{border:1px solid #bbb;border-radius:10px;padding:10px;max-height:240px;overflow:auto}
  .row{display:flex;gap:8px;padding:3px 0}
  .toolbar{display:flex;gap:8px;margin-bottom:6px}
  button{padding:6px 14px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer}
  .muted{color:#777;font-size:.9rem}
  .section{margin-bottom:18px}
  ul{padding-left:18px}
</style>
</head>
<body>

<h1>무기 조합 모드</h1>

<div class="grid">
  <div>
    <h2>날</h2>
    <div id="blade" class="card">—</div>
  </div>
  <div>
    <h2>손잡이</h2>
    <div id="handle" class="card">—</div>
  </div>
</div>

<br>

<label>
  <input type="checkbox" id="noDup" checked>
  날 / 손잡이 중복 금지
</label>

<br><br>

<label>
  보스무기 확률:
  <input type="range" id="bossRate" min="0" max="100" value="30">
  <span id="bossRateVal">30%</span>
</label>

<br><br>

<button id="draw">조합 생성</button>
<p class="muted">보스무기가 날로 선택되면 손잡이는 생성되지 않습니다.</p>

<hr>

<h2>최근 조합 (최대 10개)</h2>
<ul id="history"></ul>

<hr>

<!-- 선택 영역 -->
<div class="section">
<h2>일반무기 – 날</h2>
<div class="toolbar">
  <button onclick="setAll('bladeGeneral',true)">모두 선택</button>
  <button onclick="setAll('bladeGeneral',false)">모두 해제</button>
</div>
<div id="bladeGeneral" class="list"></div>
</div>

<div class="section">
<h2>일반무기 – 손잡이</h2>
<div class="toolbar">
  <button onclick="setAll('handleGeneral',true)">모두 선택</button>
  <button onclick="setAll('handleGeneral',false)">모두 해제</button>
</div>
<div id="handleGeneral" class="list"></div>
</div>

<div class="section">
<h2>보스무기</h2>
<div class="toolbar">
  <button onclick="setAll('bladeBoss',true)">모두 선택</button>
  <button onclick="setAll('bladeBoss',false)">모두 해제</button>
</div>
<div id="bladeBoss" class="list"></div>
</div>

<script>
/* ===== 데이터 ===== */
const general = [
"인형의 세이버","겨울의 레이피어","가시나무 곡도","크라트 경찰봉","소방도끼",
"명인 요리사의 칼","폭군 암살자의 단도","전력 코일봉","눈먼 자의 쌍날창",
"산성 결정창","생사의 대검","뼈를 끊는 톱","무용수의 곡도","대형 파이프렌치",
"군용삽","기폭 곡괭이","흑철 절삭기","명예의 창","부스터 글레이브",
"피스톨 착암기","저주받은 기사의 할버드","코일 묠니르","도시의 장창",
"원형 전기톱","산성 대곡도","시계검","카커스 결정도끼",
"샐러맨더 단도","살아있는 인형들의 도끼"
];

const generalDLC = [
"로렌치니 볼트","미치광이 바람개비","내일의 인형 용접기",
"라 벤데타","아르케의 수호자","침묵 설교단의 메이스"
];

const boss = [
"일곱 가지의 태엽보도","에티켓","아르크의 성검","약속의 트리아이나",
"퍼펫 더 리퍼","얼어붙은 만찬","쌍룡검","우로보로스의 눈",
"부의 대가","인간성의 증거","황금의 거짓말","청룡언월도"
];

const bossDLC = [
"어궁구","죽음의 발톱","창백한 기사","모나드의 장미검"
];
function saveChecks(){
  const state = {};
  document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    state[cb.id] = cb.checked;
  });
  localStorage.setItem("weapon-checks", JSON.stringify(state));
}
function loadChecks(){
  const saved = JSON.parse(localStorage.getItem("weapon-checks") || "{}");
  Object.entries(saved).forEach(([id, val])=>{
    const cb = document.getElementById(id);
    if(cb) cb.checked = val;
  });
}
window.addEventListener("load", loadChecks);
/* ===== 렌더 ===== */
function render(listId, items, prefix, defaultChecked=true){
  const el = document.getElementById(listId);
  const saved = loadChecks();          // ← 저장된 상태 읽기
  el.innerHTML = "";

  items.forEach((w, i)=>{
    const id = `${prefix}_${i}`;
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = id;

    // ✅ 저장된 값이 있으면 그걸 우선 사용
    cb.checked = saved[id] ?? defaultChecked;

    // ✅ 변경 시 자동 저장
    cb.addEventListener("change", saveChecks);

    const label = document.createElement("label");
    label.className = "row";
    label.appendChild(cb);
    label.append(" " + w);

    el.appendChild(label);
  });
}

const allGeneral=[...general,...generalDLC];
const allBoss=[...boss,...bossDLC];

render("bladeGeneral", allGeneral, "bg");
render("handleGeneral", allGeneral, "hg");
render("bladeBoss", allBoss, "bb");

/* ===== 유틸 ===== */
function setAll(id,val){
  document.querySelectorAll(`#${id} input`).forEach(c=>c.checked=val);
}
const rand = arr => arr[Math.floor(Math.random()*arr.length)];

/* ===== 히스토리 ===== */
const history=[];
function pushHistory(text){
  history.unshift(text);
  if(history.length>10) history.pop();
  document.getElementById("history").innerHTML =
    history.map(h=>`<li>${h}</li>`).join("");
}

/* ===== 슬라이더 ===== */
const rate=document.getElementById("bossRate");
const rateVal=document.getElementById("bossRateVal");
rate.oninput=()=>rateVal.textContent=rate.value+"%";

/* ===== 조합 ===== */
document.getElementById("draw").onclick=()=>{
  const noDup=document.getElementById("noDup").checked;
  const bossProb=Number(rate.value);

  const bladeGeneral=[], handlePool=[], bladeBoss=[];

  allGeneral.forEach((w,i)=>{
    if(document.getElementById(`bg_${i}`).checked) bladeGeneral.push(w);
    if(document.getElementById(`hg_${i}`).checked) handlePool.push(w);
  });

  allBoss.forEach((w,i)=>{
    if(document.getElementById(`bb_${i}`).checked) bladeBoss.push(w);
  });

  if(!bladeGeneral.length && !bladeBoss.length){
    alert("날 후보가 없습니다");
    return;
  }

  const roll=Math.random()*100;
  const useBoss = bladeBoss.length && roll < bossProb;

  let blade, handle="—";

  if(useBoss){
    blade=rand(bladeBoss);
    pushHistory(`${blade}`);
  }else{
    blade=rand(bladeGeneral);
    if(handlePool.length){
      let h;
      do{ h=rand(handlePool); }
      while(noDup && h===blade && handlePool.length>1);
      handle=h;
    }
    pushHistory(`${blade} + ${handle}`);
  }

  document.getElementById("blade").textContent=blade;
  document.getElementById("handle").textContent=handle;
};
  
</script>

</body>
</html>
